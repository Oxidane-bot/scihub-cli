[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scihub-cli"
version = "0.5.3"
description = "Multi-source academic paper downloader (Sci-Hub, Unpaywall, CORE)"
authors = [
    {name = "Sci-Hub CLI", email = "example@example.com"},
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "beautifulsoup4>=4.15.0",
    "soupsieve>=2.8.4",
    "curl-cffi>=0.15.0",
    "cloudscraper>=1.2.71",
    # 1.x currently pulls onnxruntime builds unavailable on some supported
    # Python 3.10 platforms. Keep the compatible converter line until support
    # is either restored upstream or this project raises its Python floor.
    "pymupdf4llm>=0.2.0,<1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
scihub-cli = "scihub_cli.scihub_dl_refactored:main"

[tool.setuptools]
packages = [
    "scihub_cli",
    "scihub_cli.config",
    "scihub_cli.converters",
    "scihub_cli.core",
    "scihub_cli.network",
    "scihub_cli.sources",
    "scihub_cli.utils",
]

[tool.setuptools.package-data]
scihub_cli = ["py.typed", "scihub-cli.SKILL.md"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "__pycache__/*"]

[tool.setuptools.cmdclass]
build_py = "scihub_cli.build.NoBytecodeBuildPy"

[dependency-groups]
dev = [
    "ruff>=0.14.8",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires network access (set SCIHUB_CLI_RUN_NETWORK_TESTS=1)",
    "e2e: requires installed package (set SCIHUB_CLI_RUN_INTEGRATION=1)",
]
addopts = "-m 'not integration and not e2e'"

[tool.ruff]
# Python version
target-version = "py310"

# Line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
# Use double quotes
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix line endings
line-ending = "lf"
