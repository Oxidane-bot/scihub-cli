name: Publish Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --locked pytest -m "not integration and not e2e"

      - name: Audit dependencies
        run: uv run --locked --with pip-audit pip-audit

      - name: Run ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Build distributions
        run: uv build --wheel --sdist --out-dir dist

      - name: Smoke test installed wheel
        run: |
          set -euo pipefail
          smoke_venv="$RUNNER_TEMP/scihub-cli-publish-smoke"
          uv venv --python python "$smoke_venv"
          smoke_python="$smoke_venv/bin/python"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python "$smoke_python" "$wheel"
          cd "$RUNNER_TEMP"
          "$smoke_python" -m scihub_cli --version
          "$smoke_venv/bin/scihub-cli" --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
